name: Deploy to S3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without publishing the website
        type: boolean
        default: false

jobs:
  # Fork pull requests never execute untrusted code on the private Mac. Keep
  # this red so a skipped private-runner check cannot be mistaken for acceptance.
  untrusted-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a trusted branch for validation
        run: |
          echo "::error::Fork pull requests are not executed on the private self-hosted runner. A maintainer must move reviewed changes to a trusted branch before validation."
          exit 1

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, personal-mac]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - name: Prepare pnpm cache directory
        run: mkdir -p "$(pnpm store path --silent)"

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
        env:
          PUBLIC_WAITLIST_API_URL: ${{ vars.PUBLIC_WAITLIST_API_URL }}

      - run: pnpm test:unit

      # Performance budget: fails the build if a change cooks the benchmark
      # (thresholds in .lighthouserc.json, calibrated with ~25% headroom over
      # the 2026-07 audit numbers: mobile perf 0.95, LCP 2.9s, 457KB total).
      - name: Lighthouse CI perf budget
        run: pnpm dlx @lhci/cli@0.15.x autorun

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          PUBLIC_WAITLIST_API_URL: ${{ vars.PUBLIC_WAITLIST_API_URL }}

      - name: Test isolated launch journeys
        run: pnpm test:launch-qa

      - name: Preserve launch QA evidence locally
        if: always()
        shell: bash
        run: |
          if [ ! -d output/launch-qa ]; then
            echo "No launch QA evidence was produced."
            exit 0
          fi

          evidence_dir="$HOME/.local/share/agent-workflows/launch-qa/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence_dir"
          cp -R output/launch-qa/. "$evidence_dir/"
          echo "Saved launch QA evidence to $evidence_dir"

      - name: Upload short-lived launch QA evidence
        if: always() && hashFiles('output/launch-qa/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: launch-qa-${{ github.run_id }}
          path: output/launch-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Build and test the chat backend
        working-directory: server
        run: |
          pnpm build
          pnpm test

  # Never deploy from a pull_request event — that trigger exists only to run
  # the test job as a PR check. push (to master) and workflow_dispatch (manual
  # re-deploy) still deploy unless a manual run requests validation only.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && inputs.validate_only != true
    runs-on: [self-hosted, macOS, ARM64, personal-mac]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - name: Prepare pnpm cache directory
        run: mkdir -p "$(pnpm store path --silent)"

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          PUBLIC_WAITLIST_API_URL: ${{ vars.PUBLIC_WAITLIST_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          # Hashed build assets never change under the same name — cache for a
          # year. Everything else (HTML, root files like og-image.jpg) must
          # revalidate so deploys show up immediately. Without Cache-Control,
          # S3 serves nothing and browsers fall back to heuristic caching +
          # revalidation on every repeat view.
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --exclude "*" --include "_astro/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      # Astro emits nested pages as route/index.html. An S3 REST origin does not
      # resolve /route or /route/ to that object, so publish both clean URL forms.
      - name: Publish clean page routes
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            route="${file#dist/}"
            route="${route%/index.html}"

            aws s3api put-object \
              --bucket "$S3_BUCKET" \
              --key "$route" \
              --body "$file" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"

            aws s3api put-object \
              --bucket "$S3_BUCKET" \
              --key "$route/" \
              --body "$file" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done < <(find dist -mindepth 2 -name index.html -print0)

      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
